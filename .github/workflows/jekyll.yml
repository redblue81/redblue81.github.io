name: Deploy Jekyll to gh-pages

on:
  schedule:
    - cron: '0 12 * * *'  # ogni giorno a mezzogiorno UTC
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write   # serve per poter fare push su gh-pages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build site with Jekyll
        run: bundle exec jekyll build

      - name: Check search script syntax
        run: |
          node --check assets/search.js
          node --check assets/legacy-redirect.js

      - name: Validate search index
        run: ruby -rjson -e 'JSON.parse(File.read("_site/search.json")); puts "search.json OK"'

      - name: Validate post URLs
        run: ruby scripts/check-urls.rb

      - name: Check internal links and images
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external \
            --assume-extension \
            --ignore-empty-alt \
            --ignore-missing-alt \
            --no-enforce-https

      - name: Add CNAME file
        if: github.event_name != 'pull_request'
        run: echo "red-blue.it" > ./_site/CNAME

      - name: Deploy to gh-pages branch
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          commit_message: "Deploy site via GitHub Actions"
