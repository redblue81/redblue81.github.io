name: Deploy Jekyll to gh-pages

on:
  schedule:
    - cron: '0 12 * * *'  # ogni giorno a mezzogiorno UTC
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write   # serve per poter fare push su gh-pages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build site with Jekyll
        run: bundle exec jekyll build

      - name: Install html-proofer
        run: gem install html-proofer -v 5.2.3 --no-document

      - name: Check internal links and images
        run: |
          htmlproofer ./_site \
            --disable-external \
            --assume-extension \
            --ignore-empty-alt \
            --ignore-missing-alt \
            --no-enforce-https \
            --ignore-urls "/assets/images/xc3028-v27.fw,/assets/images/k10temp.tar.gz,/assets/images/em28xx-new.tar.gz"

      - name: Add CNAME file
        if: github.event_name != 'pull_request'
        run: echo "red-blue.it" > ./_site/CNAME

      - name: Deploy to gh-pages branch
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          commit_message: "Deploy site via GitHub Actions"
