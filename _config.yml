title:              RedBlue's Blog
email:              redblue81@gmail.com
description:        Another technology addicted's personal page

# Form contatti (FormSubmit).
# Alla prima submission riceverai una mail di conferma con un endpoint
# casuale: sostituisci il valore sotto con https://formsubmit.co/<string>
# per non esporre l'indirizzo email nell'HTML.
contact_form_action: "https://formsubmit.co/redblue81@gmail.com"

# Analytics cookieless (Cloudflare Web Analytics). Lascia vuoto se non lo usi.
# Il token si ottiene in Cloudflare -> Web Analytics.
cloudflare_analytics_token: ""
author:             RedBlue
baseurl:            ""
url:                "https://red-blue.it"

locale: it_IT
lang: it

future: false

# Mantiene gli URL identici tra build locale e CI (GitHub Actions usa UTC).
# Non impostare Europe/Rome: cambierebbe gli URL dei post vicini a mezzanotte.
timezone: Etc/UTC

# Esclude dal sito pubblicato i file di lavoro e le dipendenze.
# Jekyll sostituisce la lista di default quando "exclude" è presente,
# quindi qui sono riportate anche le esclusioni standard.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md

paginate: 5
paginate_path: "posts/page:num/"

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
#  - jekyll-archives
#  - jekyll-auto-image
#theme:              jekyll-theme-clean-blog
remote_theme:       StartBootstrap/startbootstrap-clean-blog-jekyll@1f8996f010afdbdebfbb36c27858e62e3373f34a

# Social Profiles
twitter_username:   redblue81
github_username:    redblue81
facebook_username:  angeloredbluepascadopoli
instagram_username: redblue81 
linkedin_username: angelopascadopoli
